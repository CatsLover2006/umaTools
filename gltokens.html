<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="uma.css">
        <style>
            .main-flex {
                margin-top: 0 !important;
            }
            
            .main-flex div {
                height: 150px !important;
                width: 300px;
            }

            .songDetails, .songBonus {
                height: 100% !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            div.songBonus {
                transform: translateX(-0.1em);
            }

            .songBonus img {
                transform: translateY(2px);
                margin-right: 2px !important;
            }

            span.rainbow {
                background-image: linear-gradient(to bottom right, #b827fc 0%, #2c90fc 25%, #b8fd33 50%, #fec837 75%, #fd1892 100%);
                border-radius: 3px;
                margin-right: 2px;
                transform: translateY(2px);
                display: block;
                float: left;
                height: 1em;
                width: 1em;
            }

            ul {
                margin: 0.5em 0 0 0;
                list-style-type: none;
            }

            ul img {
                height: 1em !important;
                transform: translateY(2px);
                margin-right: 0.25em !important;
            }

            .songBonus img, .songBonus span.rainbow {
                margin-left: 0.1em;
            }

            .songBonus span.rainbow img {
                margin-left: 0;
            }

            span.rainbow img {
                transform: scale(0.9);
            }

            div.autoSize {
                height: auto !important; 
                width: auto !important;
            }

            div.song {
                height: auto !important;
                max-width: 352px;
                width: auto !important;
            }

            @container (min-width: 700px) {
                div.song {
                    max-width: 668px;
                }
            }

            img.song {
                border-radius: 3px;
            }

            input {
                display:none;
            }

            .songbox {
                transition: color ease-in 0.1s, background-color ease-in 0.1s;
            }

            .songbox:hover {
                background-color: #ddd;
            }
            
            :checked + label .songbox {
                background-color: black;
                color: white;
            }
            
            :checked + label .songbox:hover {
                background-color: #222;
            }

            img.half {
                margin-right: -0.375em !important;
            }

            .concert h3 {
                margin: 0.4em 0 0 0;
            }

            .concert ul {
                list-style-position: inside;
                column-count: 2;
            }
        </style>
        <script
			  src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
			  integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8="
			  crossorigin="anonymous"></script>
        <script>
            const songToTokens = [
                [21, 0, 0, 21, 0],
                [14, 0, 0, 16, 14],
                [32, 0, 0, 12, 0],
                [0, 0, 32, 0, 12],
                [0, 21, 0, 0, 21],
                [0, 0, 21, 0, 21],
            ];
            const lastSongsInConcerts = [3, 5];
            const songCount = 6;
            var token = 0;
            var song = 0;
            var concert = 0;
            var reqTokens = [0, 0, 0, 0, 0];
            function updateTokens() {
                concert = 0;
                for (token = 0; token < 5; token++)
                    reqTokens[token] = 0;
                for (song = 0; song < songCount; song++) {
                    if (!$(`#song${song}`).is(":checked"))
                        for (token = 0; token < 5; token++) {
                            reqTokens[token] += songToTokens[song][token];
                            console.log(reqTokens[token])
                        }
                    if (lastSongsInConcerts.includes(song)) {
                        for (token = 0; token < 5; token++) {
                            console.log(`#c${concert}_${token}`);
                            console.log($(`#c${concert}_${token}`));
                            console.log(reqTokens[token]);
                            $(`#c${concert}_${token}`).html(reqTokens[token]);
                            reqTokens[token] = 0;
                        }
                        concert++;
                    }
                }
            }
            $(function() {
                for (song = 0; song < songCount; song++) {
                    $(`#song${song}`).on("click", updateTokens)
                }
                updateTokens();
                console.log("ready");
            });
        </script>
